<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>Birmotor V30</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#bellBtn{position:fixed;right:14px;top:12px;z-index:99999;border:0;border-radius:999px;background:#101828;color:#fff;padding:11px 14px;font-size:14px;font-weight:700;box-shadow:0 4px 16px #0003;touch-action:manipulation}
#bellBtn.on{background:#067647}
#bellNotice{display:none;position:fixed;left:14px;right:14px;top:58px;z-index:99998;background:#fff7d6;border:2px solid #f2c94c;color:#101828;border-radius:16px;padding:13px 15px;font-weight:800;text-align:center;box-shadow:0 8px 24px #0003;animation:pulse .9s ease-in-out infinite}
#bellNotice.show{display:block}
@keyframes pulse{50%{transform:scale(1.02)}}
</style>
</head>
<body>
<iframe id="appFrame" src="Birmotor-V29-Buton-Cozum.html" title="Birmotor"></iframe>
<button id="bellBtn" type="button">🔔 Sesi Aç</button>
<div id="bellNotice">🔔 YENİ YOLCULUK ÇAĞRISI</div>
<script>
const frame=document.getElementById('appFrame'),bellBtn=document.getElementById('bellBtn'),bellNotice=document.getElementById('bellNotice');
let audioCtx=null,timer=null,enabled=false,wasRequest=false;
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();enabled=true;bellBtn.textContent='🔔 Ses Açık';bellBtn.classList.add('on')}catch(e){}}
function ring(){if(!enabled||!audioCtx)return;try{const now=audioCtx.currentTime;[0,0.18,0.36].forEach((off,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=[880,1175,988][i];g.gain.setValueAtTime(.0001,now+off);g.gain.exponentialRampToValueAtTime(.16,now+off+.02);g.gain.exponentialRampToValueAtTime(.0001,now+off+.17);o.connect(g);g.connect(audioCtx.destination);o.start(now+off);o.stop(now+off+.19)})}catch(e){}}
function stopAlert(){if(timer){clearInterval(timer);timer=null}bellNotice.classList.remove('show');wasRequest=false}
function startAlert(){if(wasRequest)return;wasRequest=true;bellNotice.classList.add('show');ring();timer=setInterval(ring,1800);try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}}
function inspectDriver(){try{const d=frame.contentDocument;if(!d)return;const req=d.getElementById('driverRequest'),state=d.getElementById('driverState');const visible=req&&getComputedStyle(req).display!=='none';const driverAvailable=state&&/Müsait/.test(state.textContent||'')&&!/değil/.test(state.textContent||'');if(visible&&driverAvailable)startAlert();else if(!visible||(state&&!/Müsait/.test(state.textContent||'')))stopAlert()}catch(e){}}
bellBtn.addEventListener('click',unlockAudio);
document.addEventListener('touchstart',()=>{if(enabled&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume()},{passive:true});
frame.addEventListener('load',()=>setTimeout(inspectDriver,800));
setInterval(inspectDriver,700);
</script>
</body>
</html>
