<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>Birmotor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;position:relative;overflow:hidden}
header{height:64px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;position:relative;z-index:5;border-bottom:1px solid #eee}
.logo{font-size:25px;font-weight:850;letter-spacing:-1.2px}.logo span{color:#16a34a}.avatar{width:40px;height:40px;border-radius:50%;background:#101828;color:#fff;display:grid;place-items:center;font-weight:700}
#map{height:45vh;min-height:320px;z-index:1}.leaflet-control-zoom{display:none}
.locate{position:absolute;right:16px;top:78px;z-index:4;width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 14px #0002;font-size:21px}
.sheet{background:#fff;border-radius:24px 24px 0 0;margin-top:-18px;position:relative;z-index:3;padding:18px 16px 26px;box-shadow:0 -6px 20px #0001}
.handle{width:42px;height:5px;border-radius:5px;background:#d0d5dd;margin:0 auto 15px}
.field{border:1px solid #e4e7ec;border-radius:14px;padding:12px 13px;margin-bottom:10px;display:flex;align-items:center;gap:10px;background:#fff}
.field input{border:0;outline:0;width:100%;font-size:15px;background:transparent}.field small{display:block;color:#667085;font-size:12px;margin-bottom:2px}.field strong{font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:#12b76a;flex:none}.sq{width:10px;height:10px;border-radius:2px;background:#101828;flex:none}
.searchrow{display:flex;gap:8px}.searchrow input{flex:1;border:1px solid #e4e7ec;border-radius:12px;padding:12px;font-size:15px;outline:none}.searchrow button{border:0;border-radius:12px;background:#101828;color:#fff;padding:0 15px;font-weight:700}
.results{max-height:140px;overflow:auto;margin:4px 0 8px}.result{padding:10px;border-bottom:1px solid #eee;font-size:14px}.result:last-child{border:0}
.row{display:flex;gap:10px;margin:10px 0}.info{flex:1;background:#f8f9fb;border-radius:12px;padding:11px}.info small{color:#667085}.info b{display:block;margin-top:3px}
.main{width:100%;border:0;border-radius:14px;background:#101828;color:#fff;padding:16px;font-size:17px;font-weight:750}.main:disabled{opacity:.45}
nav{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:12px 6px 18px;background:#fff}nav button{border:0;background:none;color:#667085;font-size:12px}nav button.active{color:#101828;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.modal.show{display:flex}.card{width:min(520px,100%);margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 18px 30px}.card h2{margin:0 0 6px}.driver{display:flex;gap:12px;align-items:center;padding:14px 0}.pic{width:52px;height:52px;border-radius:50%;background:#101828;color:#fff;display:grid;place-items:center;font-weight:700}.status{padding:11px;border-radius:11px;background:#ecfdf3;color:#067647;margin:10px 0}.secondary{background:#f2f4f7!important;color:#101828!important;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Bir<span>motor</span></div><div class="avatar">Ş</div></header>
<div style="position:relative"><div id="map"></div><button class="locate" onclick="useLocation()">⌖</button></div>
<section class="sheet">
<div class="handle"></div>
<div class="field"><span class="dot"></span><div style="flex:1"><small>Alınacak konum</small><strong id="pickup">Konum alınmadı</strong></div></div>
<div class="searchrow"><input id="search" placeholder="Nereye gideceksin?"><button onclick="searchAddress()">Ara</button></div>
<div id="results" class="results"></div>
<div class="field"><span class="sq"></span><div style="flex:1"><small>Hedef</small><strong id="destination">Hedef adres seç</strong></div></div>
<div class="row"><div class="info"><small>Tahmini süre</small><b id="eta">—</b></div><div class="info"><small>Tahmini ücret</small><b id="fare">—</b></div></div>
<button id="call" class="main" onclick="callMotor()" disabled>🏍️ Motor Çağır</button>
</section>
<nav><button class="active">⌂<br>Harita</button><button onclick="alert('Henüz yolculuk yok.')">◷<br>Geçmiş</button><button onclick="alert('Profil\\nBirmotor kullanıcısı')">◎<br>Profil</button></nav>
</div>

<div class="modal" id="modal"><div class="card">
<h2 id="mtitle">Sürücü aranıyor</h2><p id="msub">Yakındaki sürücüler kontrol ediliyor.</p>
<div class="driver"><div class="pic">M</div><div><b>Mehmet K.</b><br><small>⭐ 4.9 · 2 dk uzakta · Siyah motor</small></div></div>
<div class="status" id="status">● Sürücü bulunuyor…</div>
<button class="main" onclick="advance()">Devam</button>
<button class="main secondary" onclick="closeModal()">İptal</button>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, userMarker, targetMarker, userPos, step=0;
const $=id=>document.getElementById(id);
map=L.map('map',{zoomControl:false}).setView([37.783,38.28],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

function setUser(lat,lon){
 userPos=[lat,lon]; if(userMarker) map.removeLayer(userMarker);
 userMarker=L.marker(userPos).addTo(map).bindPopup('Mevcut konum');
 map.setView(userPos,15); $('pickup').textContent='Mevcut konum';
}
function useLocation(){
 if(!navigator.geolocation){alert('Bu cihaz konum bilgisini desteklemiyor.');return}
 navigator.geolocation.getCurrentPosition(p=>setUser(p.coords.latitude,p.coords.longitude),()=>alert('Konum izni verilmedi veya konum alınamadı.'),{enableHighAccuracy:true,timeout:10000});
}
useLocation();
map.on('click',e=>{
  setUser(e.latlng.lat,e.latlng.lng);
});
async function searchAddress(){
 const q=$('search').value.trim(); if(!q)return;
 $('results').innerHTML='<div class="result">Adres aranıyor…</div>';
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=tr&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
  const data=await r.json(); $('results').innerHTML='';
  if(!data.length){$('results').innerHTML='<div class="result">Adres bulunamadı.</div>';return}
  data.forEach(x=>{const d=document.createElement('div');d.className='result';d.textContent=x.display_name;d.onclick=()=>selectTarget(x);$('results').appendChild(d)})
 }catch(e){$('results').innerHTML='<div class="result">Adres araması şu an kullanılamıyor.</div>'}
}
function selectTarget(x){
 const lat=+x.lat,lon=+x.lon;
 if(targetMarker)map.removeLayer(targetMarker); targetMarker=L.marker([lat,lon]).addTo(map);
 $('destination').textContent=x.display_name.split(',').slice(0,2).join(',');
 $('results').innerHTML=''; $('search').value='';
 map.fitBounds(L.latLngBounds(userPos||[lat,lon],[lat,lon]),{padding:[35,35]});
 let km=userPos?map.distance(userPos,[lat,lon])/1000:5; let min=Math.max(5,Math.round(km*3.2+4)); let fare=Math.round(45+km*12);
 $('eta').textContent=min+' dk'; $('fare').textContent='₺'+fare; $('call').disabled=false;
}
function callMotor(){$('modal').classList.add('show');step=0}
function advance(){
 step++; if(step===1){$('mtitle').textContent='Sürücü bulundu';$('msub').textContent='Mehmet K. konumunuza geliyor.';$('status').textContent='🏍️ Yaklaşık 2 dakika'}
 else if(step===2){$('mtitle').textContent='Yolculuk başladı';$('msub').textContent='Güvenli yolculuklar!';$('status').textContent='● Yolculuk devam ediyor'}
 else{$('mtitle').textContent='Yolculuk tamamlandı';$('msub').textContent='Demo yolculuk tamamlandı.';$('status').textContent='⭐ Puanlama ekranı hazır';}}
function closeModal(){$('modal').classList.remove('show')}
</script>
</body>
</html>
