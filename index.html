<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Birmotor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;position:relative;overflow:hidden}
header{height:64px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:relative;z-index:3}
.logo{font-size:24px;font-weight:800;letter-spacing:-1px}.logo span{color:#16a34a}
.avatar{width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;font-weight:700}
.map{height:46vh;min-height:330px;position:relative;background:#dbe5d8;overflow:hidden}
.map:before{content:"";position:absolute;inset:-20%;background:
linear-gradient(28deg,transparent 44%,#fff 45%,#fff 48%,transparent 49%),
linear-gradient(105deg,transparent 38%,#fff 39%,#fff 42%,transparent 43%),
linear-gradient(165deg,transparent 61%,#fff 62%,#fff 65%,transparent 66%);
opacity:.9}
.road{position:absolute;background:#fff;border-radius:30px;transform:rotate(-18deg);width:120%;height:34px;left:-10%;top:45%}
.road2{position:absolute;background:#fff;border-radius:30px;transform:rotate(55deg);width:90%;height:26px;left:25%;top:8%}
.pin{position:absolute;left:50%;top:49%;transform:translate(-50%,-100%);width:44px;height:44px;border-radius:50% 50% 50% 0;background:#111827;color:#fff;rotate:-45deg;display:grid;place-items:center;box-shadow:0 6px 18px #0003}
.pin b{rotate:45deg;font-size:20px}
.location{position:absolute;right:16px;top:16px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 15px #0002;font-size:20px}
.sheet{background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;position:relative;z-index:2;padding:20px 18px 30px;box-shadow:0 -5px 20px #0001}
.handle{width:42px;height:5px;background:#d1d5db;border-radius:8px;margin:-8px auto 18px}
.field{border:1px solid #e5e7eb;border-radius:14px;padding:13px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#16a34a}.square{width:10px;height:10px;border-radius:2px;background:#111827}
.field small{display:block;color:#6b7280;margin-bottom:2px}.field strong{font-size:15px}
.row{display:flex;gap:10px;margin:12px 0}.info{flex:1;background:#f9fafb;border-radius:12px;padding:11px}.info small{color:#6b7280}.info b{display:block;margin-top:3px}
button.main{width:100%;border:0;background:#111827;color:#fff;border-radius:14px;padding:16px;font-size:17px;font-weight:700}
button.main:active{transform:scale(.99)}
nav{display:flex;justify-content:space-around;padding:12px 8px 18px;border-top:1px solid #eee;background:#fff}
nav button{border:0;background:none;color:#6b7280;font-size:12px}nav button.active{color:#111827;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:flex-end}.modal.show{display:flex}
.card{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:24px 18px 30px}
.card h2{margin:0 0 8px}.driver{display:flex;align-items:center;gap:12px;padding:14px 0}.driverpic{width:52px;height:52px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;font-weight:700}
.status{background:#ecfdf5;color:#166534;border-radius:10px;padding:10px;margin:10px 0}.secondary{background:#f3f4f6!important;color:#111827!important;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Bir<span>motor</span></div><div class="avatar">Ş</div></header>
<section class="map">
<button class="location" onclick="locate()">⌖</button><div class="road"></div><div class="road2"></div>
<div class="pin"><b>🏍️</b></div>
</section>
<section class="sheet">
<div class="handle"></div>
<div class="field"><i class="dot"></i><div><small>Alınacak konum</small><strong>Mevcut konumum</strong></div></div>
<div class="field"><i class="square"></i><div><small>Nereye?</small><strong id="destination">Hedef adres seç</strong></div></div>
<div class="row"><div class="info"><small>Tahmini süre</small><b>12 dk</b></div><div class="info"><small>Tahmini ücret</small><b>₺85</b></div></div>
<button class="main" onclick="callMotor()">🏍️ Motor Çağır</button>
</section>
<nav><button class="active">⌂<br>Harita</button><button onclick="history()">◷<br>Geçmiş</button><button onclick="profile()">◎<br>Profil</button></nav>
</div>

<div class="modal" id="modal"><div class="card">
<h2 id="title">Sürücü aranıyor</h2><p id="sub">Yakındaki Birmotor sürücüleri kontrol ediliyor.</p>
<div class="driver"><div class="driverpic">M</div><div><b>Mehmet K.</b><br><small>⭐ 4.9 · 2 dk uzakta</small></div></div>
<div class="status" id="status">● Sürücü bulunuyor…</div>
<button class="main" onclick="nextStatus()">Devam</button>
<button class="main secondary" onclick="closeModal()">İptal</button>
</div></div>
<script>
let step=0;
function callMotor(){document.getElementById('modal').classList.add('show');step=0}
function nextStatus(){step++;let s=document.getElementById('status'),t=document.getElementById('title'),p=document.getElementById('sub');
if(step===1){t.textContent='Sürücü bulundu';p.textContent='Mehmet K. konumunuza geliyor.';s.textContent='🏍️ 2 dk içinde burada'}
else if(step===2){t.textContent='Yolculuk başladı';p.textContent='Güvenli yolculuklar!';s.textContent='● Yolculuk devam ediyor'}
else{t.textContent='Yolculuk tamamlandı';p.textContent='Ücret: ₺85';s.textContent='⭐ Yolculuğunuzu puanlayın';}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function locate(){alert('Konum izni gerçek cihazda tarayıcı tarafından istenir.')}
function history(){alert('Yolculuk geçmişi: Henüz yolculuk yok.')}
function profile(){alert('Profil\\nTelefon: +90 *** *** ** **\\nSürücü modu: Kapalı')}
</script>
</body>
</html>
